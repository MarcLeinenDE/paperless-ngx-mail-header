name: Real Paperless integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.locales.outputs.matrix }}
      integration_required: ${{ steps.changes.outputs.integration_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: changes
        name: Classify changes conservatively
        run: python scripts/ci_changes.py
      - name: Build and check one shared candidate wheel
        run: |
          python -m pip install -e '.[test]' build
          python scripts/check_translations.py
          python -m build
          python scripts/verify_distributions.py
      - id: locales
        name: Discover all contributed locales
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from paperless_ngx_mail_header.i18n import supported_languages
          base = 'tests/integration/compose.yml'
          zoned = base + ':tests/integration/compose.timezone.yml'
          matrix = {'include': [
              {'scenario': code, 'language': code, 'timezone': 'Europe/Berlin',
               'timezone_set': 'true', 'compose': zoned if code == 'en' else zoned + ':tests/integration/compose.localized.yml'}
              for code in supported_languages()
          ] + [
              {'scenario': 'en-new-york', 'language': 'en', 'timezone': 'America/New_York',
               'timezone_set': 'true', 'compose': zoned},
              {'scenario': 'en-utc-default', 'language': 'en', 'timezone': 'UTC',
               'timezone_set': 'false', 'compose': base},
          ]}
          print('matrix=' + json.dumps(matrix))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-release
          path: dist/*
          if-no-files-found: error
  integration:
    name: integration (${{ matrix.scenario }})
    needs: candidate
    if: needs.candidate.outputs.integration_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.candidate.outputs.matrix) }}
    env:
      COMPOSE_FILE: ${{ matrix.compose }}
      SMOKE_LANGUAGE: ${{ matrix.language }}
      SMOKE_SCENARIO: ${{ matrix.scenario }}
      SMOKE_TIME_ZONE: ${{ matrix.timezone }}
      SMOKE_TIME_ZONE_SET: ${{ matrix.timezone_set }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-release
          path: dist
      - name: Prepare synthetic inputs and ephemeral credentials
        run: |
          python -m pip install requests pymupdf
          python tests/integration/run.py --prepare
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              for name in ('SMOKE_PASSWORD', 'SMOKE_SECRET_KEY'):
                  value = secrets.token_urlsafe(48)
                  print('::add-mask::' + value)
                  environment.write(name + '=' + value + '\n')
          PY
      - name: Start disposable native and plugin stacks
        run: docker compose up --build --detach --wait --wait-timeout 600
      - name: Record actual parser selection and versions
        run: |
          for service in native plugin; do
            docker compose exec -T "$service" python3 manage.py shell -c 'import json,os,sys; from django.conf import settings; from paperless.version import __full_version_str__; from paperless.parsers.registry import get_parser_registry; p=get_parser_registry().get_parser_for_file("message/rfc822", "fixture.eml"); print("SMOKE_VERSION=" + json.dumps({"paperless":__full_version_str__,"python":sys.version.split()[0],"parser":p.name,"parser_version":p.version,"time_zone":settings.TIME_ZONE,"time_zone_env":os.environ.get("PAPERLESS_TIME_ZONE")}))' > "work/integration/$service-version.txt"
          done
          docker compose images --format json > work/integration/images.json
      - name: Run synthetic imports and compare real localized PDFs
        run: python tests/integration/run.py
      - name: Collect diagnostics for this synthetic environment
        if: always()
        run: docker compose logs --no-color > work/integration/container.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-evidence-${{ matrix.scenario }}
          path: |
            work/integration/report/
            work/integration/*-version.txt
            work/integration/images.json
            work/integration/container.log
          if-no-files-found: warn
      - name: Remove the disposable environment and its volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
  required:
    name: Paperless integration checks
    if: ${{ always() }}
    needs: [candidate, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the candidate and enforce the integration policy
        env:
          CANDIDATE_BUILD_RESULT: ${{ needs.candidate.result }}
          PAPERLESS_MATRIX_RESULT: ${{ needs.integration.result }}
          INTEGRATION_REQUIRED: ${{ needs.candidate.outputs.integration_required }}
        run: |
          test "$CANDIDATE_BUILD_RESULT" = success
          case "$INTEGRATION_REQUIRED" in
            true) test "$PAPERLESS_MATRIX_RESULT" = success ;;
            false) test "$PAPERLESS_MATRIX_RESULT" = skipped ;;
            *) echo 'Missing or invalid integration policy'; exit 1 ;;
          esac

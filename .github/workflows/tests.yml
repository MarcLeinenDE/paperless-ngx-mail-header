name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e '.[test]' build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Validate all translation catalogs
        run: python scripts/check_translations.py
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions and checksums
        run: python scripts/verify_distributions.py
      - name: Check package metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  required:
    name: Unit and package checks
    if: ${{ always() }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python version to pass
        env:
          PYTHON_MATRIX_RESULT: ${{ needs.tests.result }}
        run: test "$PYTHON_MATRIX_RESULT" = success

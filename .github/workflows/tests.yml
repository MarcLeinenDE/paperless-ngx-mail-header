name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e '.[test]' build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Validate all translation catalogs
        run: python scripts/check_translations.py
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions and checksums
        run: python scripts/verify_distributions.py
      - name: Check package metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

name: Tests and package build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e '.[test]' build
      - name: Run tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Inspect wheel metadata
        run: |
          python - <<'PY'
          import glob, zipfile
          paths = glob.glob('dist/*.whl')
          assert len(paths) == 1, paths
          with zipfile.ZipFile(paths[0]) as z:
              entries = [n for n in z.namelist() if n.endswith('entry_points.txt')]
              assert len(entries) == 1
              data = z.read(entries[0]).decode()
              assert '[paperless_ngx.parsers]' in data
              assert 'paperless_mail_header' in data
          print('Wheel entrypoint verified')
          PY
